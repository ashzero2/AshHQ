<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — AshHQ</title>
  <style>
    :root { --bg: #09090b; --fg: #e4e4eb; --muted: #5a5a7a; --accent: #e8c06c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 50% 40%, #18161a 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 320px;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e8c06c 0%, #fb923c 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #09090b;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 24px rgba(232,192,108,0.3);
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.875rem; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      background: var(--accent);
      color: #09090b;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">A</div>
    <h1>You're offline</h1>
    <p>AshHQ needs a network connection to load. Check your connection and try again.</p>
    <a href="/" onclick="location.reload(); return false;">Try again</a>
  </div>
</body>
</html>
